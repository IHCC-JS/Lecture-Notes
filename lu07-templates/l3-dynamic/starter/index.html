<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer type="module"></script>
</head>
<body>
<main>
    <h1 class="text-3xl font-bold text-center text-indigo-700 mb-6">Reading Tracker</h1>

    <div id="dashboard-content">
        <!-- content placed by JS on page load -->
    </div>

    <div class="flex justify-between mt-8 space-x-4">
        <button id="prev-btn"
                class="flex-1 bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg">
            ← Previous
        </button>
        <button id="add-pages-btn"
                class="flex-1 bg-green-500 text-white font-semibold py-2 rounded-lg">
            +10 Pages Read
        </button>
        <button id="next-btn"
                class="flex-1 bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg">
            Next →
        </button>
    </div>
</main>
</body>
</html>
