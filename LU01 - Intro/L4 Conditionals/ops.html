<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // assigment with single =
        let firstName = 'Luke'
        let country = 'United States'
        // Arithmetic Operators
        let numOne = 4
        let numTwo = 3
        let sum = numOne + numTwo
        let diff = numOne - numTwo
        let mult = numOne * numTwo
        let div = numOne / numTwo
        let remainder = numOne % numTwo
        let powerOf = numOne ** numTwo

        console.log(sum, diff, mult, div, remainder, powerOf) // 7,1,12,1.33,1, 64


        const gravity = 9.81      // in m/s2
        let mass = 72             // in Kilogram

        // Let us calculate weight of an object
        const weight = mass * gravity
        console.log(weight + 'N')        // 706.32 N(Newton)

        const boilingPoint = 100  // temperature in oC, boiling point of water
        const bodyTemp = 37       // body temperature in oC


        // Concatenating string with numbers using string interpolation
        /*
         The boiling point of water is 100C.
         Human body temperature is 37 oC.
         The gravity of earth is 9.81 m/s2.
         */
        console.log(
            `The boiling point of water is ${boilingPoint}C.\nHuman body temperature is ${bodyTemp}C.\nThe gravity of earth is ${gravity} m/s2.`
        )

        //Comparison Operators
        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Strict_equality 
        console.log(3 == '3')           // true, compare only value
        console.log(3 === '3')          // false, compare both value and data type
        console.log('mango'.length == 'avocado'.length)  // false
        console.log('mango'.length != 'avocado'.length)  // true
        console.log('mango'.length < 'avocado'.length)   // true

        //  Pre Icrement operators
        let count = 0
        console.log(++count)        // 1
        console.log(++count)        // 2
        console.log(--count)        // 1

        //post Increment Operators 
        console.log(count++)
        console.log(count)

    </script>
</body>

</html>
