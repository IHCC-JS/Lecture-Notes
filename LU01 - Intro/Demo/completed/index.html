<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slot Machine</title>
</head>
<body>

<h1>Slot Machine</h1>
<p>Open the console. Refresh to play again.</p>

<script>
    const start = prompt("Type PLAY to pull the lever!");

    if (start != null && start.trim().toUpperCase() === "PLAY") {

        // 3 random numbers (1–3)
        const n1 = Math.floor(Math.random() * 3) + 1;
        const n2 = Math.floor(Math.random() * 3) + 1;
        const n3 = Math.floor(Math.random() * 3) + 1;

        console.log("Raw numbers:", n1, n2, n3);

        // Convert each number to a symbol
        let s1, s2, s3;
        switch (n1) {
            case 1: s1 = "🍒"; break;
            case 2: s1 = "⭐"; break;
            case 3: s1 = "🍋"; break;
        }

        switch (n2) {
            case 1: s2 = "🍒"; break;
            case 2: s2 = "⭐"; break;
            case 3: s2 = "🍋"; break;
        }

        switch (n3) {
            case 1: s3 = "🍒"; break;
            case 2: s3 = "⭐"; break;
            case 3: s3 = "🍋"; break;
        }

        console.log("Symbols:", s1, s2, s3);
        alert("Your spin:\n" + s1 + "  " + s2 + "  " + s3);

        // result
        if (n1 === n2 && n2 === n3) {
            alert("🎉 JACKPOT! All three match!");
        }
        else if (n1 === n2 || n1 === n3 || n2 === n3) {
            alert("Two match! Small prize!");
        }
        else {
            alert("No match. Try again!");
        }

    } else {
        alert("You didn’t play. Refresh to try again.");
    }
</script>

</body>
</html>
