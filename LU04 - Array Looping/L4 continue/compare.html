<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>
    const nums = [1, 4, 20, 30, 4];

    for (let i = 0; i < nums.length; i++) {

        if (nums[i] < 5) {
            continue;  // skip small numbers
        }
        if (nums[i] > 50) {
            console.log("Too big, stopping.");
            break;     // stop entire loop
        }

        console.log("Number is big enough: " + nums[i])
    }

</script>
</body>
</html>
