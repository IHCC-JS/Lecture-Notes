<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-5">
<h1>Maze Game</h1>
<div id="maze" class="grid"
     style="grid-template-columns: repeat(12, 40px)">
    <!-- Maze build by JS-->
</div>
<p>Use arrow keys to move. Reach the red square.</p>
<div id="message" class="text-green-400">
    <!-- Message displayed by JS if the player wins-->
</div>
</body>
</html>
