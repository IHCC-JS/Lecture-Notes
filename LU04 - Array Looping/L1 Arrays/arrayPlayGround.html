<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const numbers = [1, 2, 3, 4, 5]
        numbers[0] = 10      // changing 1 at index 0 to 10
        numbers[1] = 20      // changing  2 at index 1 to 20

        console.log(numbers) // [10, 20, 3, 4, 5]

        const countries = [
            'Albania',
            'Bolivia',
            'Canada',
            'Denmark',
            'Ethiopia',
            'Finland',
            'Germany',
            'Hungary',
            'Ireland',
            'Japan',
            'Kenya'
        ]
        //replacing items in an array using index
        countries[0] = 'Afghanistan'  // Replacing Albania by Afghanistan
        let lastIndex = countries.length - 1
        countries[lastIndex] = 'Korea' // Replacing Kenya by Korea

        console.log(countries)
        //using fill command on an array. Really only works on arrays using constructor
        const eightXValues = Array(8).fill('X') // it creates eight element values filled with 'X'
        console.log(eightXValues) // ['X', 'X','X','X','X','X','X','X']

        const four4values = Array(4).fill(4) // it creates 4 element values filled with '4'
        console.log(four4values) // [4, 4, 4, 4]

        //you can do this be kinda dumb
        const test = [1, 2, 3, 4]
        test.fill("2")
        console.log(test)

        //now lets use concatenation on two arrays 
        const fruits = ['banana', 'orange', 'mango', 'lemon']                 // array of fruits
        const vegetables = ['Tomato', 'Potato', 'Cabbage', 'Onion', 'Carrot'] // array of vegetables
        const fruitsAndVegetables = fruits.concat(vegetables)                 // concatenate the two arrays

        console.log(fruitsAndVegetables)

        //use index of, wish we had this in java didn't you all
        //returns -1 if not found
        console.log(fruitsAndVegetables.indexOf("Cabbage"))

        for(let i = 0; i < countries.length; i++){
            if(countries[i] === "Japan"){
                alert("Found: " + countries[i])
            }
        }

        fruits.push("Apple");
        console.log(fruits);
        fruits.pop()
        console.log(fruits);
    </script>
</body>

</html>
