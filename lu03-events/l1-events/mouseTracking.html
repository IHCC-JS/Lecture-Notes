<!doctype html>
<html lang="en">
    <head>
        <title>Catch the dot Example</title>
        <style>
            #game-container {
                width: 400px;
                height: 400px;
                border: 2px solid black;
                position: relative;
                overflow: hidden;
            }

            #target {
                width: 50px;
                height: 50px;
                background-color: blue;
                border-radius: 50%;
                position: absolute;
            }
        </style>
    </head>

    <body>
        <div id="game-container">
            <div id="target"></div>
        </div>
        <script>
            // Setup: game area, dot, and bounds.
            const container = document.querySelector('#game-container');
            const target = document.querySelector('#target');
            const size = 50;
            const limit = 400 - size;

            // Current dot position.
            let x = 175;
            let y = 175;

            // On mouse move, push the dot one step away from the cursor.
            container.addEventListener('mousemove', (event) => {
                const rect = container.getBoundingClientRect();
                const mouseX = event.clientX - rect.left;
                const mouseY = event.clientY - rect.top;

                // Calculate the distance from the mouse to the center of the dot.
                const dx = x + size / 2 - mouseX;
                const dy = y + size / 2 - mouseY;
                // How much to move the dot (fixed step size).
                const step = 8;

                // Move the dot in the direction away from the mouse, but only along one axis to keep it simple.
                if (Math.abs(dx) > Math.abs(dy)) {
                    x += dx > 0 ? step : -step;
                } else {
                    y += dy > 0 ? step : -step;
                }

                x = Math.max(0, Math.min(limit, x));
                y = Math.max(0, Math.min(limit, y));
                target.style.left = x + 'px';
                target.style.top = y + 'px';
            });

            target.style.left = x + 'px';
            target.style.top = y + 'px';
        </script>
    </body>
</html>
