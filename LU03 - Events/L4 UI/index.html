<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tip Calculator</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Tip Calculator</h1>
        <form>
            <label for="bill">Bill Total</label>
            <input
                type="number"
                name="bill"
                id="bill"
                placeholder="Enter bill amount"
                min="0"
                step="0.01"
                required
            />
            <div class="tip-options">
                <div>
                    <input
                        type="radio"
                        id="tip-8"
                        name="tip"
                        value="8"
                        required
                    />
                    <label for="tip-8">8%</label>
                </div>
                <div>
                    <input type="radio" id="tip-12" name="tip" value="12" />
                    <label for="tip-12">12%</label>
                </div>
                <div>
                    <input type="radio" id="tip-15" name="tip" value="15" />
                    <label for="tip-15">15%</label>
                </div>
                <div>
                    <input type="radio" id="tip-20" name="tip" value="20" />
                    <label for="tip-20">20%</label>
                </div>
            </div>

            <button type="submit">Calculate Total</button>
        </form>

        <h2>Result</h2>
        <p id="result">Enter a bill amount, then pick a tip percentage.</p>
    </body>
</html>
