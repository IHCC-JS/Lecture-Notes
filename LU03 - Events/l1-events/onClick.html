<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document Object Model</title>
</head>

<body>
<!--This is just for an example DON'T DO THING THIS WAY-->
<button onclick="clickMe()">Click Me</button>
<script>
    function clickMe () {
        alert('We can attach event on HTML element')

        let random1 = Math.floor(Math.random() * (255 + 1));
        let random2 = Math.floor(Math.random() * (255 + 1));
        let random3 = Math.floor(Math.random() * (255 + 1));

        const randomColor = "rgb(" + random1 + "," + random2  + "," + random3 + ")" ;
        document.body.style.backgroundColor = randomColor;
    }
</script>
</body>

</html>
