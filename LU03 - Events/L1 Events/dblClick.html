<!doctype html>
<html lang="en">
<head>
    <title>CLick the dot Example</title>
    <style>
        #game-container {
            width: 400px;
            height: 400px;
            border: 2px solid black;
        }

        #target {
            width: 50px;
            height: 50px;
            background-color: blue;
            border-radius: 50%;
            position: absolute;
        }
    </style>
</head>

<body>
<div id="game-container">
    <div id="target"></div>
</div>
<script>
    const target = document.querySelector("#target");
    let score = 0;


    target.addEventListener("dblclick", () => {
        console.log(`Score: ${(score += 10)}`);

        const newLeft = Math.floor(Math.random() * 350);
        const newTop = Math.floor(Math.random() * 350);

        target.style.left = newLeft + "px";
        target.style.top = newTop + "px";
    });
</script>
</body>
</html>
