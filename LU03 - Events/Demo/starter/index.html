<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!--    Random number box website
            Devin Johnson 5/4/2023      -->
    <script src="script.js" defer></script>
    <title>Unit 6: Project 1</title>
</head>
<body>
    <div class="container">
        <div class="left-column">
            <form class="form">

                <div class="number-header">
                    <h1>Enter a Number</h1>
                    <h2>0 - 100</h2>
                </div>
                
                <div class="inputs">
                    <input type="number" name="number" id="number">
                    <button type="button">Generate Numbers</button>
                    <div class="error-message hidden">Please enter a number between 0 and 100.</div>
                </div>
            </form>  
        </div>

        <div class="right-column">
            <div class="head-color-code">
                <h1>Color Key</h1>
                <div class="color-codes">
                    <div class="color-block">
                       <h2>Even</h2>
                        <div class="blue"></div> 
                    </div>
                    <div class="color-block">
                        <h2>Odd</h2>
                        <div class="red"></div>
                    </div>
                    <div class="color-block">
                        <h2>Prime</h2>
                        <div class="green"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="inside-bottom-column">
            <!--  Where boxes get inserted by JS  -->
        </div>

    </div>
    
</body>
</html>
