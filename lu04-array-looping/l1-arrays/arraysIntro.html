<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //you can use constructor and pass in starting size. 
        const myArray = Array()

        // const myArray = Array(3)
        console.log(myArray)


        const arr = []
        console.log(arr)

        //build array and initial values. 
        const numbers = [0, 3.14, 9.81, 37, 98.6, 100] // array of numbers
        const fruits = ['banana', 'orange', 'mango', 'lemon'] // array of strings, fruits

        //prints the whole array out
        console.log('Numbers:', numbers)
        //using .length method
        console.log('Number of numbers:', numbers.length)

        console.log('Fruits:', fruits)
        console.log('Number of fruits:', fruits.length)

        //mind-blowing. You can use several different data types
        //gloss over this we will go into more detail in a later unit.
        const stuff = [
            'Luke',
            250,
            true,
            { country: 'United States', city: 'Ottumwa' },
            { skills: ['HTML', 'CSS', 'JS', 'React', 'Python'] }
        ] // arrary containing different data types
        console.log(stuff)
        //ask them to ques the length of stuff
        console.log(stuff.length)

        
    </script>
</body>

</html>
