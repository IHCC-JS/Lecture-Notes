<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DataTypes</title>
</head>

<body>
<h1>Data Times and Comments</h1>
<p>Check Console</p>
<script>
    console.log(typeof "Luke"); // string
    console.log(typeof 5); // number
    console.log(typeof true); // boolean
    console.log(typeof null); // object type
    console.log(typeof undefined); // undefined

    // commenting the code itself with a single comment
    let commentFirstName = "Luke"; //single line comment
    let commentLastName = "Matheis"; //single line comment

    //Multi Line Comment
    /*
    let location = 'Ottumwa';
    let age = 100;
    let isMarried = true;
    */

    // Declaring different variables of different data types
    let firstName = "Luke"; // first name of a person
    let lastName = "Matheis"; // last name of a person
    let country = "United States"; // country
    let city = "Ottumwa"; // city
    let age = 100; // age in years
    let isMarried = true; //boolean

    // console.log(firstName, lastName, country, city, age, isMarried)

    // Declaring variables with number values
    const gravity = 9.81; // earth gravity  in m/s2
    const boilingPoint = 100; // water boiling point, temperature in °C
    const PI = 3.14; // geometrical constant
    console.log(gravity, boilingPoint, PI);

    // Variables can also be declaring in one line separated by comma, however I recommend to use a separate line to make code more readable
    let name = "Luke",
        job = "teacher",
        live = "Ottumwa";
    console.log(name, job, live);
</script>
</body>
</html>
