<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer type="module"></script>
</head>
<body>
<h1 class="text-3xl font-bold mb-6 ">Inventory Manager</h1>
<h2 id="form-title" class="text-xl mb-4">Add New Item</h2>
<form id="inventoryForm" class="grid grid-cols-1 lg:grid-cols-5 gap-4 items-end">
    <div>
        <label for="productName">Product Name</label>
        <input type="text" id="productName" required
               class="w-full p-2 border"
               placeholder="e.g., HDMI Cable">
    </div>
    <div>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" required min="0"
               class="w-full p-2 border"
               placeholder="50">
    </div>
    <div>
        <label for="price">Price</label>
        <input type="number" id="price" required step="0.01" min="0"
               class="w-full p-2 border"
               placeholder="12.99">
    </div>
    <div class="md:col-span-1">
        <button type="submit" id="submitButton"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md">
            Add Item
        </button>
    </div>
</form>
<hr class="my-6 border-gray-200">
<h2 class="text-xl font-semibold">Stock</h2>
<table class="divide-y divide-gray-200">
    <thead class="bg-gray-100">
    <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>
    </thead>
    <tbody id="inventoryTableBody" class="bg-white divide-y divide-gray-200">
        <!-- Filled by JavaScript -->
    </tbody>
</table>
</body>
</html>
