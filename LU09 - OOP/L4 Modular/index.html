<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Distance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" type="module" defer></script>
</head>
<body class="bg-gray-100 p-8">
<main class="max-w-xl mx-auto bg-white p-8 rounded-xl">
    <h1 class="text-3xl font-bold mb-6 ">Interplanetary Distance Calculator</h1>
    <p class="text-sm text-gray-500 mb-8 text-center">
        Select two bodies to find the approximate distance between them (in AU).
    </p>

    <div class="grid grid-cols-2 gap-6 mb-8">
        <div>
            <label for="planet-a" class="block text-sm">Start Planet</label>
            <select id="planet-a" class="mt-1 block w-full"></select>
        </div>

        <div>
            <label for="planet-b" class="block text-sm">End Planet</label>
            <select id="planet-b" class="mt-1 block w-full"></select>
        </div>
    </div>

    <button id="calculate-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg">
        Calculate Distance
    </button>

    <hr class="my-8">

    <p id="output-message" class="text-lg">
        Awaiting selection...
    </p>
</main>
</body>
</html>
